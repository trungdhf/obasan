<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo avatar 2D – Koharu &amp; Hinata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E6EEF7; --sky2:#D3E0EF; --ink:#33291F; --ink-soft:#6B5D50;
  --fur:#E9A955; --fur-dark:#C9853A; --cream:#FFF7EA; --cheek:#F3A5A0;
  --ai:#2F4A7A; --ai-soft:#DCE4F1; --panel:#FFFFFF; --line:#C9D5E5;
  --ok:#3E7D5A; --warn:#B4532F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#1F2A40; --sky2:#18223A; --ink:#F2EADF; --ink-soft:#B9AE9F;
    --ai:#9DB6E8; --ai-soft:#2B3A58; --panel:#243150; --line:#3A4A6C;
    --ok:#7FC79C; --warn:#F0A07E;
  }
}
:root[data-theme="dark"]{
  --sky:#1F2A40; --sky2:#18223A; --ink:#F2EADF; --ink-soft:#B9AE9F;
  --ai:#9DB6E8; --ai-soft:#2B3A58; --panel:#243150; --line:#3A4A6C;
  --ok:#7FC79C; --warn:#F0A07E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color:var(--ink); background:var(--sky);
}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:860px){.wrap{grid-template-columns:1.3fr 1fr;align-items:start}}

/* Stage */
.stage{
  position:relative;border-radius:28px;overflow:hidden;
  background:linear-gradient(var(--sky2),var(--sky));
  min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:16px 12px 8px;transition:background .8s ease;
}
.stage.night{background:linear-gradient(#141C30,#22304D)}
.stars{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none}
.stage.night .stars{opacity:1}
.bubble{
  position:relative;max-width:min(92%,460px);background:var(--cream);color:#33291F;
  border-radius:22px;padding:14px 20px;font-size:clamp(1.15rem,2.6vw,1.45rem);line-height:1.55;
  font-weight:700;text-align:center;box-shadow:0 2px 0 #E2CFAE;margin-bottom:6px;
  transition:opacity .3s ease,transform .3s ease;
}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);
  border:12px solid transparent;border-top-color:var(--cream);border-bottom:0}
.bubble.hidden{opacity:0;transform:translateY(6px)}
svg.koharu{width:min(100%,380px);height:auto;display:block}
svg.char[hidden]{display:none}
#photo .face{display:none}
#photo.f-vui .face-vui,#photo.f-buon .face-buon,#photo.f-lolang .face-lolang,
#photo.f-hon .face-hon,#photo.f-sohai .face-sohai,#photo.f-ngacnhien .face-ngacnhien{display:inline}
#photo .lids{display:none}
#photo.f-vui.blinking .lids,#photo.f-vui.sleep .lids{display:inline}
#photo.talkbob .breathe{animation:hop .35s ease-in-out infinite}
#photo.waving .breathe{animation:hop .7s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}

/* Character animation */
.breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
.tail{transform-box:fill-box;transform-origin:10% 90%;animation:wag 1.4s ease-in-out infinite}
.happy .tail{animation-duration:.45s}
.sleep .tail{animation:none}
@keyframes wag{50%{transform:rotate(-14deg)}}
.head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .8s ease}
.sleep .head{transform:rotate(-6deg) translateY(10px)}
.worried .head{transform:rotate(4deg)}
.eyes-open{transform-box:fill-box;transform-origin:center;transition:transform .08s linear}
.eyes-open.blink{transform:scaleY(.08)}
.eyes-happy,.eyes-sleep,.brows{display:none}
.happy .eyes-open,.sleep .eyes-open{display:none}
.happy .eyes-happy{display:inline}
.sleep .eyes-sleep{display:inline}
.worried .brows{display:inline}
.worried .eyes-open{transform:scale(.85)}
.paw{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s ease}
.waving .paw{animation:wave .5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(10deg)}}
.zzz{opacity:0}
.sleep .zzz{opacity:1}
.zzz text{animation:float 3s ease-in-out infinite}
.zzz text:nth-child(2){animation-delay:1s}
.zzz text:nth-child(3){animation-delay:2s}
@keyframes float{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:16px}
.panel h1{font-size:1.25rem;margin:0;line-height:1.3}
.panel p{margin:0;color:var(--ink-soft);font-size:.95rem;line-height:1.6}
.status{display:flex;align-items:center;gap:10px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.dot.standby{background:#7B8BA8}.dot.calling{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.meter{height:10px;border-radius:6px;background:var(--ai-soft);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--ai);transition:width .05s linear}
.group{display:grid;gap:8px}
.group h2{font-size:.95rem;margin:0;color:var(--ink-soft);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{
  font:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  border-radius:12px;border:1.5px solid var(--ai);background:transparent;color:var(--ai);
  padding:9px 14px;min-height:44px;
}
button.primary{background:var(--ai);color:var(--panel)}
button[aria-pressed="true"]{background:var(--ai);color:var(--panel)}
button:focus-visible{outline:3px solid var(--fur);outline-offset:2px}
.log{list-style:none;margin:0;padding:0;max-height:170px;overflow:auto;font-size:.88rem;line-height:1.5;color:var(--ink-soft);display:grid;gap:4px}
.log li b{color:var(--ink);font-weight:700}
.note{font-size:.85rem}
@media (prefers-reduced-motion: reduce){
  .breathe,.tail,.zzz text,.waving .paw,.dot.calling{animation:none!important}
}
</style>
</head>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), bubble = $('bubble');
  let svg, eyes, hole, tongue;
  const CHARS = {
    koharu: {
      pitch: 1.35, rate: 0.92,
      hello: 'こんにちは！こはるです。',
      welcome: '田中さん、おかえりなさい！',
      bye: 'じゃあ、また後でお話ししましょうね',
      calls: ['田中さん〜、今日は暑いので、お水を飲みましょうね','田中さん、聞こえますか？お水の時間ですよ','田中さ〜ん、どこにいますか？'],
      talk: 'おはようございます！今日はいい天気ですね。お散歩はいかがですか？',
      happy: 'それはよかったですね！', worried: '大丈夫ですか？少し休みましょうか',
      sad: 'それは寂しかったですね…', pout: 'もう、田中さんったら〜', scared: 'えっ、大丈夫ですか！？', surprised: 'えっ、本当ですか！？すごいですね！'
    },
    hinata: {
      pitch: 1.7, rate: 1.0,
      hello: 'おばあちゃん、こんにちは！ひなただよ。',
      welcome: 'おばあちゃん、おかえり！',
      bye: 'じゃあね、またあとでおはなししようね',
      calls: ['おばあちゃ〜ん、きょうはあついから、おみずのもうね！','おばあちゃん、きこえる？おみずのじかんだよ','おばあちゃ〜ん、どこにいるの？'],
      talk: 'おばあちゃん、おはよう！きょうはいいてんきだね。いっしょにおさんぽしたいな',
      happy: 'やった〜！よかったね！', worried: 'だいじょうぶ？ちょっとやすもうか',
      sad: 'そっか…さみしかったね', pout: 'もう〜、おばあちゃんったら！', scared: 'えっ、だいじょうぶ！？', surprised: 'えっ、ほんとう！？すご〜い！'
    }
  };
  CHARS.photo = CHARS.hinata;
  let charKey = 'koharu';
  let pm = null;
  const L = () => CHARS[charKey];
  function bindChar(key){
    charKey = key;
    document.querySelectorAll('svg.char').forEach(el => { el.style.display = el.id === key ? 'block' : 'none'; });
    svg = $(key);
    eyes = svg.querySelector('.eyes-open');
    hole = svg.querySelector('.mouth-hole');
    tongue = svg.querySelector('.mouth-tongue');
    pm = svg.dataset.mouth === 'photo' ? {
      fill: svg.querySelector('.pm-fill'), clip: svg.querySelector('.pm-clip'), cover: svg.querySelector('.pm-cover'),
      line: svg.querySelector('.pm-line'), teeth: svg.querySelector('.pm-teeth'),
      tongue: svg.querySelector('.pm-tongue')
    } : null;
    document.querySelectorAll('#charBtns button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.char === key)));
  }
  bindChar('koharu');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const IDLE_TO_STANDBY = 20;   // giây im lặng thì vào chế độ chờ
  const VOICE_RMS = 0.035;      // ngưỡng coi là có tiếng nói

  let state = 'active';         // active | standby | calling
  let mood = 'normal';
  let audioCtx = null, analyser = null, buf = null, micOn = false;
  let speaking = false, speakUntil = 0;
  let mouth = 0, lastVoice = performance.now(), voiceStreak = 0;
  let callTimer = null, callCount = 0;

  // ---------- helpers ----------
  function log(msg){
    const li = document.createElement('li');
    const t = new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    li.innerHTML = `<b>${t}</b> ${msg}`;
    $('log').prepend(li);
  }
  function say(text, {voice=true} = {}){
    bubble.textContent = text;
    bubble.classList.remove('hidden');
    const est = Math.max(1500, text.length * 170);
    speaking = true; speakUntil = performance.now() + est;
    if (voice && 'speechSynthesis' in window){
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP'; u.rate = L().rate; u.pitch = L().pitch;
        const ja = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('ja'));
        if (ja) u.voice = ja;
        u.onend = () => { speaking = false; };
        speechSynthesis.speak(u);
      }catch(e){}
    }
  }
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function chime(loud=false){
    ensureAudio(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [[784,0],[659,0.28]].forEach(([f,d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, now+d);
      g.gain.linearRampToValueAtTime(loud ? 0.25 : 0.12, now+d+0.03);
      g.gain.exponentialRampToValueAtTime(0.001, now+d+0.9);
      o.connect(g).connect(audioCtx.destination);
      o.start(now+d); o.stop(now+d+1);
    });
  }
  function applyClasses(){
    document.querySelectorAll('svg.char').forEach(el => el.classList.remove('sleep','happy','worried','waving'));
    svg.classList.toggle('sleep', state === 'standby');
    svg.classList.toggle('happy', state !== 'standby' && mood === 'happy');
    svg.classList.toggle('worried', state !== 'standby' && ['sad','worried','pout','scared'].includes(mood));
    if (pm) setFace();
    svg.classList.toggle('waving', state === 'calling');
    stage.classList.toggle('night', state === 'standby');
    const dot = $('dot');
    dot.className = 'dot' + (state === 'standby' ? ' standby' : state === 'calling' ? ' calling' : '');
    $('statusText').textContent = state === 'active' ? 'Đang trò chuyện' :
      state === 'standby' ? 'Chế độ chờ (đã đóng phiên Live)' : 'Đang gọi bà…';
    $('standbyBtn').textContent = state === 'standby' ? 'Đánh thức Koharu' : 'Chuyển sang chế độ chờ';
  }
  function setMood(m){
    mood = m;
    document.querySelectorAll('#moodBtns button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.mood === m)));
    applyClasses();
  }

  // ---------- state transitions ----------
  function goStandby(reason){
    clearTimeout(callTimer); callCount = 0;
    say(L().bye);
    setTimeout(() => {
      state = 'standby'; applyClasses();
      bubble.classList.add('hidden');
    }, 1800);
    log(`Vào chế độ chờ (${reason}). Đóng phiên Live để ngừng tính phí.`);
  }
  function goActive(reason){
    clearTimeout(callTimer); callCount = 0;
    state = 'active'; lastVoice = performance.now();
    setMood('happy'); applyClasses();
    say(L().welcome);
    log(`Phát hiện bà (${reason}). Mở lại phiên Live, nạp tóm tắt hội thoại cũ.`);
    setTimeout(() => { if (mood === 'happy') setMood('normal'); }, 4000);
  }
  function startCall(){
    if (state === 'calling') return;
    state = 'calling'; callCount = 0; applyClasses();
    log('Agent quyết định gọi: cảnh báo say nắng hôm nay. Dùng TTS tạo sẵn, chưa mở phiên Live.');
    callOnce();
  }
  function callOnce(){
    if (state !== 'calling') return;
    if (callCount >= L().calls.length){
      state = 'standby'; applyClasses();
      say('（ご家族にLINEでお知らせしました）', {voice:false});
      log('Gọi 3 lần không thấy phản hồi → gửi LINE cho gia đình (giả lập), chờ người xác nhận.');
      return;
    }
    chime(callCount > 0);
    setTimeout(() => say(L().calls[callCount]), 900);
    log(`Lần gọi ${callCount + 1}/3.`);
    callCount++;
    callTimer = setTimeout(callOnce, 9000);
  }

  // ---------- mic ----------
  async function toggleMic(){
    const btn = $('micBtn');
    if (micOn){
      micOn = false; btn.setAttribute('aria-pressed','false'); btn.textContent = 'Bật micro';
      $('timerText').textContent = 'Micro đã tắt.';
      log('Tắt micro.');
      return;
    }
    ensureAudio();
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
      buf = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      micOn = true; lastVoice = performance.now();
      btn.setAttribute('aria-pressed','true'); btn.textContent = 'Tắt micro';
      log('Bật micro. Im lặng ' + IDLE_TO_STANDBY + ' giây sẽ tự vào chế độ chờ.');
    }catch(e){
      $('timerText').textContent = 'Không mở được micro. Hãy cho phép quyền micro trong trình duyệt, hoặc dùng nút "Cho Koharu nói thử".';
      log('Không truy cập được micro.');
    }
  }
  function micLevel(){
    if (!micOn || !analyser) return 0;
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i]*buf[i];
    return Math.sqrt(s / buf.length);
  }

  const FACES = {
    vui:       {mouth:{cx:250.5, cy:250, rx:36, ry:24, style:'smile', w:[9,19], h:[5,22]}},
    buon:      {mouth:{cx:247.5, cy:251, rx:22, ry:12, style:'frown', w:[7,13], h:[3,13]}},
    lolang:    {mouth:null},
    hon:       {mouth:{cx:255, cy:248, rx:28, ry:16, style:'frown', w:[7,13], h:[3,13]}},
    sohai:     {mouth:{cx:250, cy:252, rx:33, ry:18, style:'frown', w:[10,18], h:[4,16]}},
    ngacnhien: {mouth:{cx:233.5, cy:255, rx:22, ry:22, style:'round', w:[6,12], h:[7,16]}}
  };
  const MOOD_FACE = {normal:'vui', happy:'vui', sad:'buon', worried:'lolang', pout:'hon', scared:'sohai', surprised:'ngacnhien'};
  let faceKey = 'vui', lastLoud = 0;
  function setFace(){
    faceKey = state === 'standby' ? 'vui' : (MOOD_FACE[mood] || 'vui');
    Object.keys(FACES).forEach(k => svg.classList.toggle('f-' + k, k === faceKey));
    const f = FACES[faceKey].mouth;
    if (f){ pm.cover.setAttribute('cx', f.cx); pm.cover.setAttribute('cy', f.cy);
            pm.cover.setAttribute('rx', f.rx); pm.cover.setAttribute('ry', f.ry); }
  }
  function hideMouth(){
    pm.cover.style.display = 'none';
    ['fill','clip','line'].forEach(k => pm[k].setAttribute('d',''));
    pm.teeth.setAttribute('height','0'); pm.tongue.setAttribute('ry','0');
  }
  function photoMouth(m, talking){
    const F = FACES[faceKey], f = F.mouth;
    svg.classList.toggle('talkbob', !f && talking && state !== 'standby');
    if (state === 'standby'){
      const v = FACES.vui.mouth; hideMouth(); pm.cover.style.display = '';
      pm.line.setAttribute('d', `M${v.cx-11} ${v.cy-3} Q${v.cx} ${v.cy+5} ${v.cx+11} ${v.cy-3}`);
      return;
    }
    const active = f && (talking || (mood === 'normal' && faceKey === 'vui'));
    if (!active){ hideMouth(); return; }
    pm.cover.style.display = '';
    const k = talking ? 0.2 + m * 0.8 : 0.2;
    const w = f.w[0] + (f.w[1]-f.w[0]) * k, h = f.h[0] + (f.h[1]-f.h[0]) * k;
    let d, top;
    if (f.style === 'round'){
      top = f.cy - h/2;
      d = `M${f.cx-w} ${f.cy} A${w} ${h/2} 0 1 1 ${f.cx+w} ${f.cy} A${w} ${h/2} 0 1 1 ${f.cx-w} ${f.cy} Z`;
    } else if (f.style === 'smile'){
      const lift = 2.5 + k;
      top = f.cy - h/2;
      d = `M${f.cx-w} ${top-lift} Q${f.cx} ${top+2.5} ${f.cx+w} ${top-lift} ` +
          `Q${f.cx+w*0.8} ${top+h} ${f.cx} ${top+h} Q${f.cx-w*0.8} ${top+h} ${f.cx-w} ${top-lift} Z`;
    } else {
      // miệng buồn: mép trễ xuống, viền trên cong vồng lên
      const y0 = f.cy + h * 0.35;
      top = f.cy - h * 0.65;
      d = `M${f.cx-w} ${y0} Q${f.cx} ${top - h*0.55} ${f.cx+w} ${y0} ` +
          `Q${f.cx} ${y0 + h*0.35} ${f.cx-w} ${y0} Z`;
    }
    ['fill','clip','line'].forEach(key => pm[key].setAttribute('d', d));
    const teeth = (f.style !== 'round' && k > 0.45) ? 2.5 + (k-0.45) * 4 : 0;
    pm.teeth.setAttribute('y', (top - 6).toFixed(1));
    pm.teeth.setAttribute('height', teeth ? (teeth + 6).toFixed(1) : '0');
    pm.tongue.setAttribute('cx', f.cx);
    pm.tongue.setAttribute('cy', (top + h - 1).toFixed(1));
    pm.tongue.setAttribute('rx', (w * 0.6).toFixed(1));
    pm.tongue.setAttribute('ry', (h * 0.28).toFixed(1));
  }

  // ---------- blink ----------
  function scheduleBlink(){
    setTimeout(() => {
      if (!reduced){
        eyes.classList.add('blink'); svg.classList.add('blinking');
        const el = svg;
        setTimeout(() => { eyes.classList.remove('blink'); el.classList.remove('blinking'); }, 130);
      }
      scheduleBlink();
    }, 2200 + Math.random() * 3800);
  }

  // ---------- main loop ----------
  function frame(now){
    const rms = micLevel();
    const level = Math.min(1, Math.max(0, (rms - 0.012) * 9));
    $('meter').style.width = (level * 100) + '%';

    if (speaking && now > speakUntil + 400 && !(window.speechSynthesis && speechSynthesis.speaking)) speaking = false;
    let target = 0;
    if (speaking && state !== 'standby'){
      target = 0.35 + 0.65 * Math.abs(Math.sin(now / 75)) * (0.6 + 0.4 * Math.random());
    }
    if (state !== 'standby') target = Math.max(target, level);
    mouth += (target - mouth) * 0.35;
    const m = mouth < 0.04 ? 0 : mouth;
    if (pm){ if (level > 0.15) lastLoud = now; photoMouth(m, (speaking || now - lastLoud < 350)); } else {
    hole.setAttribute('ry', (m * 17).toFixed(2));
    hole.setAttribute('rx', (12 + m * 6).toFixed(2));
    tongue.setAttribute('ry', (m * 7).toFixed(2));
    tongue.setAttribute('cy', (+tongue.dataset.cy + m * 9).toFixed(2));
    hole.setAttribute('cy', hole.dataset.cy);
    }

    // presence logic (voice stands in for camera presence in this demo)
    if (micOn){
      if (rms > VOICE_RMS){ voiceStreak++; lastVoice = now; } else voiceStreak = 0;
      if (state === 'active' && !speaking){
        const left = Math.ceil(IDLE_TO_STANDBY - (now - lastVoice) / 1000);
        $('timerText').textContent = left > 0 ? `Im lặng thêm ${left} giây sẽ vào chế độ chờ.` : '';
        if (left <= 0) goStandby('im lặng ' + IDLE_TO_STANDBY + ' giây');
      } else if (state === 'standby'){
        $('timerText').textContent = 'Đang chờ. Nói gì đó khoảng 1 giây để đánh thức.';
        if (voiceStreak > 40) goActive('nghe thấy tiếng nói');
      } else if (state === 'calling'){
        $('timerText').textContent = 'Đang gọi. Trả lời bằng giọng nói để bà "đến".';
        if (voiceStreak > 30) goActive('bà trả lời');
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- wire up ----------
  $('micBtn').addEventListener('click', toggleMic);
  $('talkBtn').addEventListener('click', () => {
    ensureAudio();
    if (state !== 'active'){ goActive('nút thử'); return; }
    say(L().talk);
    lastVoice = performance.now();
  });
  $('standbyBtn').addEventListener('click', () => {
    ensureAudio();
    state === 'standby' ? goActive('chạm màn hình') : goStandby('chuyển tay');
  });
  $('callBtn').addEventListener('click', () => { ensureAudio(); startCall(); });
  $('arriveBtn').addEventListener('click', () => { ensureAudio(); goActive('camera thấy khuôn mặt (giả lập)'); });
  document.querySelectorAll('#moodBtns button').forEach(b => b.addEventListener('click', () => {
    ensureAudio();
    if (state !== 'active'){ goActive('chạm màn hình'); }
    setMood(b.dataset.mood);
    if (b.dataset.mood !== 'normal' && L()[b.dataset.mood]) say(L()[b.dataset.mood]);
    lastVoice = performance.now();
  }));
  document.querySelectorAll('#charBtns button').forEach(b => b.addEventListener('click', () => {
    ensureAudio();
    bindChar(b.dataset.char); applyClasses();
    if (state !== 'standby') say(L().hello);
    log('Đổi nhân vật: ' + b.textContent + '.');
  }));
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

  applyClasses();
  scheduleBlink();
  requestAnimationFrame(frame);
  log('Nhân vật đã sẵn sàng.');
})();
</script>
</body>
</html>
